version: '3.8'

services:
  db:
    image: postgres:16
    container_name: traffic_db
    environment:
      POSTGRES_DB: traffic_system
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: traffic_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
